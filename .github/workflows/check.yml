name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: General checks / x86_64-linux
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate the public flake
        run: nix flake check --no-build

      - name: Check nix formatting
        run: find . -type f -name '*.nix' -not -path './.git/*' -print0 | xargs -0 nix fmt -- --check

      - name: Check image-update command
        run: nix run .#update-images -- --help

  sdk:
    name: ${{ matrix.toolchain }} / x86_64-linux
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        toolchain: [devkitarm, devkitppc, devkita64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK, inventory checks, and platform examples
        run: nix build -L --keep-going .#checks.x86_64-linux.${{ matrix.toolchain }}
